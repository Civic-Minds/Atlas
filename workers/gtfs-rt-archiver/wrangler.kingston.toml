# Kingston Transit only: the Atlas Studio demo agency (CIV-1682, approved by Ryan 2026-11-15).
# Writes to atlas-live like every other archiver (CIV-1906: one Live bucket, kept 60 days), under kingston/ and
# positions/kingston/. Every minute: positions each run, trip updates every 5th.
name = "atlas-gtfs-rt-archiver-kingston"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ARCHIVE_SHARD = "kingston"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "atlas-live"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
