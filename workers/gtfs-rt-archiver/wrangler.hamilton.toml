name = "atlas-gtfs-rt-archiver-hamilton"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ARCHIVE_SHARD = "hamilton"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "atlas-live"

# Hamilton (HSR) recorded every minute again from 2026-11-18 (Ryan). Writes positions/hamilton/ and hamilton/ in atlas-live,
# kept 60 days by the bucket-wide lifecycle rule (CIV-1906, Ryan 2026-11-18).
# CIV-2217 (2026-11-26): no cron; the cloud recorder (wrangler.recorder.toml) records this shard's agencies.
[observability]
enabled = true
