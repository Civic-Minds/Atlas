name = "atlas-gtfs-rt-archiver-hamilton"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ARCHIVE_SHARD = "hamilton"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "atlas-live"

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]
