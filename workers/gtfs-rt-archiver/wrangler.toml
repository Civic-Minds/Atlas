name = "atlas-gtfs-rt-archiver-ttc-positions"
account_id = "334f99db1478f9e95eaea65b3b9e1fdd"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ARCHIVE_SHARD = "ttc-positions"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "atlas-live"

# TTC vehicle positions every minute, kept 60 days by atlas-live's lifecycle rule (CIV-1906, Ryan 2026-11-18).
# This cron has run in Cloudflare since 2026-08-17; restored here so the repo matches it (CIV-1689).
# CIV-2217 (2026-11-26): no cron; the cloud recorder (wrangler.recorder.toml) records this shard's agencies.
[observability]
enabled = true
