name: Deploy hosted MCP

# CIV-3111 (Ryan, 2026-11-27: "ideally the MCP never gives information that differs from the website"): every push to
# main that passes CI deploys the hosted Atlas Studio MCP Worker (atlas-studio-mcp) from the same commit the site
# deploys from. Its data ships inside the Worker (wrangler.pilot-test.jsonc, DATA_FROM_ASSETS), so the job rebuilds it
# from the published release with this commit's code first: read only, no R2 writes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The newest push wins: a deploy still building when a newer one starts is cancelled.
concurrency:
  group: mcp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build data · Deploy Worker
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout the commit CI passed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Refuses when the build has lost agencies the release's own MCP files have (scripts/mcp/workerAssets.ts).
      - name: Build the MCP's data from the published release (read only)
        run: nice -n 10 npx tsx scripts/mcp/workerAssets.ts

      - name: Deploy the Worker
        working-directory: workers/atlas-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN secret is missing: the hosted MCP was not deployed."; exit 1; fi
          npx --yes wrangler@4.164.0 deploy -c wrangler.pilot-test.jsonc

      - name: Say the deploy failed
        if: failure()
        run: echo "::error::The hosted MCP was not deployed for ${{ github.event.workflow_run.head_sha || github.sha }}; it still runs the previous commit and may differ from the site."
