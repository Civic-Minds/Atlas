name: Deploy hosted MCP

# CIV-3111 (Ryan, 2026-11-27: "ideally the MCP never gives information that differs from the website"): every push to
# main that passes CI deploys the hosted Atlas Studio MCP Worker (atlas-studio-mcp, wrangler.jsonc) from the same
# commit the site deploys from. Code only: the Worker reads the published release itself, so no data is built here.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The newest push wins: a deploy still waiting when a newer one starts is cancelled.
concurrency:
  group: mcp-deploy
  cancel-in-progress: true

env:
  MCP_URL: https://atlas-studio-mcp.rhanna-334.workers.dev
  # The smoke check fails below this many agencies (527 served on 2026-11-27).
  MIN_AGENCIES: 500

jobs:
  deploy:
    name: Deploy Worker · Smoke check
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the commit CI passed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check the Worker
        run: npm run typecheck:mcp-worker

      - name: Deploy the Worker
        working-directory: workers/atlas-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN secret is missing: the hosted MCP was not deployed."; exit 1; fi
          # CIV-3165: a pasted secret can carry a newline or space, which wrangler refuses as a header value ("is an invalid
          # header value"). Spaces and newlines at either end are dropped; anything left that isn't a letter, digit, _ or -
          # (such as a second line) fails here with a plain message. Only lengths and counts are printed, never the value.
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          account=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          removed=$(( ${#CLOUDFLARE_API_TOKEN} - ${#token} ))
          if [ "$removed" -gt 0 ]; then echo "::warning::CLOUDFLARE_API_TOKEN had $removed space or newline character(s) at its ends; they were dropped. Re-save the secret without them."; fi
          lines=$(printf '%s\n' "$token" | grep -c .)
          other=$(printf '%s' "$token" | tr -d 'A-Za-z0-9_-' | wc -c | tr -d ' ')
          if [ "$other" -gt 0 ]; then echo "::error::CLOUDFLARE_API_TOKEN is ${#token} characters on $lines line(s), with $other character(s) a token can't have: re-save the secret with only the token, on one line."; exit 1; fi
          CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$account" npx --yes wrangler@4.164.0 deploy -c wrangler.jsonc --var "BUILD_SHA:$BUILD_SHA"

      # The new code is live (its BUILD_SHA answers) and the release still serves at least MIN_AGENCIES agencies.
      - name: Smoke check the live MCP
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS "$MCP_URL/health?check=1" || true)
            echo "$body"
            if node -e 'const b=JSON.parse(process.argv[1]||"{}"); process.exit(b.build===process.env.BUILD_SHA && b.agencies>=Number(process.env.MIN_AGENCIES) ? 0 : 1)' "$body"; then exit 0; fi
            sleep 10
          done
          echo "::error::The hosted MCP did not answer with $BUILD_SHA and at least $MIN_AGENCIES agencies."
          exit 1

      - name: Say the deploy failed
        if: failure()
        run: echo "::error::The hosted MCP deploy failed for ${{ github.event.workflow_run.head_sha || github.sha }}; it may still run older code than the site."
