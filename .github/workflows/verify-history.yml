name: Verify history archive

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Maximum simultaneous R2 history downloads'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Verify history archive
        run: npm run build-history -- --verify-only
        env:
          HISTORY_DOWNLOAD_CONCURRENCY: ${{ inputs.concurrency }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
