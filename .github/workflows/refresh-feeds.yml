name: Refresh GTFS feeds

on:
  schedule:
    # Mondays 06:00 UTC (~01:00 Toronto)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      agencies:
        description: 'Space-separated agency slugs to refresh (e.g. "ttc yrt"). PMTiles and history are rebuilt afterward so the map stays in sync.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.api.json

      - name: Test
        run: npm run test

      - name: Refresh agency feeds
        run: |
          if [ -n "${{ inputs.agencies }}" ]; then
            npm run refresh -- ${{ inputs.agencies }}
          else
            npm run refresh
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Install tippecanoe
        run: sudo apt-get install -y tippecanoe

      - name: Rebuild PMTiles vector tiles
        run: npm run build-pmtiles
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Verify PMTiles coverage
        run: npm run verify-pmtiles-coverage
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # NOT gated on inputs.agencies: this always processes the entire
      # atlas-archive/history/ tree (~12k files) regardless of which agencies
      # were just refreshed -- it's the exact step that crashed on
      # 2026-07-20/07-27, so a scoped smoke-test run needs it to actually
      # verify the R2 retry fix rather than skipping the one step that matters.
      - name: Rebuild history config
        run: npm run build-history
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Create pull request for updated files
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly GTFS feed refresh"
          title: "chore: weekly GTFS feed refresh"
          body: "Automated weekly GTFS feed refresh."
          base: main
          branch: automation/weekly-gtfs-refresh
          delete-branch: true
          add-paths: |
            public/data/index.json
            shared/cacheBuild.ts
            config/agencies/
