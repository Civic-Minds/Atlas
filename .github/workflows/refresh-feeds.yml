name: Refresh GTFS feeds

on:
  schedule:
    # Mondays 06:00 UTC (~01:00 Toronto)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      agencies:
        description: 'Space-separated agency slugs to smoke-test (e.g. "ttc yrt"). Leave empty for a full refresh + PMTiles/history rebuild.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.api.json

      - name: Test
        run: npm run test

      - name: Refresh agency feeds
        run: |
          if [ -n "${{ inputs.agencies }}" ]; then
            npm run refresh -- ${{ inputs.agencies }}
          else
            npm run refresh
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Skipped on a scoped smoke-test dispatch: expensive (tippecanoe + full
      # PMTiles rebuild) and unrelated to what a scoped run is meant to verify.
      - name: Install tippecanoe
        if: ${{ !inputs.agencies }}
        run: sudo apt-get install -y tippecanoe

      - name: Rebuild PMTiles vector tiles
        if: ${{ !inputs.agencies }}
        run: npm run build-pmtiles
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # NOT gated on inputs.agencies: this always processes the entire
      # atlas-archive/history/ tree (~12k files) regardless of which agencies
      # were just refreshed -- it's the exact step that crashed on
      # 2026-07-20/07-27, so a scoped smoke-test run needs it to actually
      # verify the R2 retry fix rather than skipping the one step that matters.
      - name: Rebuild history config
        run: npm run build-history
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Commit updated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/index.json shared/cacheBuild.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly GTFS feed refresh"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
