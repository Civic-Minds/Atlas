name: Rebuild data release

# Heavy full rebuild of every agency's derived data (a shared process-core change), run on a
# GitHub runner instead of a laptop. Manual only; see docs/operations/DATA_REPROCESSING.md.
#
#   gh workflow run rebuild-release.yml -f ref=<branch or SHA> -f mode=dry-run
#   gh workflow run rebuild-release.yml -f ref=main -f mode=publish -f allow="communitytransit:drop"
#
# dry-run: reprocess + PMTiles dry run, uploads the report and the release diff as artifacts.
#          Runs the branch's code with READ-ONLY R2 credentials and a read-only GitHub token, so
#          it cannot write R2 or the repo even if the code under test misbehaves.
# publish: reprocess --write -> build-pmtiles -> verify-pmtiles-remote -> build-history ->
#          publish-data-release. Refuses unless `ref` is the current tip of main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build from. Publish mode only accepts the current tip of main.'
        required: false
        default: main
        type: string
      mode:
        description: 'dry-run writes nothing (read-only keys). publish writes agency artifacts and makes the release live.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      allow:
        description: 'Space-separated reviewed release-gate overrides, each <slug>:<flag> (e.g. "communitytransit:drop"). Passed to the reprocess and publish steps. Review the dry-run report first.'
        required: false
        type: string
      concurrency:
        description: 'Agencies reprocessed in parallel (1-4). The runner has 16 GB; 2 matches the local run.'
        required: false
        default: '2'
        type: string
      start_at:
        description: 'Publish only. Resume a stopped run: reprocess (everything), pmtiles (agency artifacts already in R2), history, or publish. history and publish need resume_run_id.'
        required: false
        default: reprocess
        type: choice
        options:
          - reprocess
          - pmtiles
          - history
          - publish
      resume_run_id:
        description: 'Publish only. The run id of the earlier run to resume (its saved stamps and release manifest are downloaded). Required for start_at history or publish.'
        required: false
        type: string

# Processing output depends on the machine's timezone, and the runners are UTC: pin the zone
# everything was reviewed on until the date math is timezone independent.
env:
  TZ: America/Toronto

# Same group as the weekly refresh (refresh-feeds.yml): the two can never run at once, because
# overlapping runs could publish tiles and agency data from different builds. Queue, never
# cancel, so a run that is mid-upload always finishes.
concurrency:
  group: atlas-data-release
  cancel-in-progress: false

# Nothing gets more than read access unless a job below asks for it.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------
  # Dry run. Runs the code of any ref, so it never sees a write-capable credential: the R2 keys
  # are the read-only pair (R2_RO_*), and the GitHub token is read-only with no stored login.
  # ---------------------------------------------------------------------------------------
  dry-run:
    if: inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 345
    env:
      REF_INPUT: ${{ inputs.ref }}
      ALLOW_INPUT: ${{ inputs.allow }}
      CONCURRENCY_INPUT: ${{ inputs.concurrency }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check the inputs and the read-only keys
        env:
          RO_KEY: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          RO_SECRET: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
        run: |
          [[ "$CONCURRENCY_INPUT" =~ ^[1-4]$ ]] || { echo "concurrency must be 1-4, got: $CONCURRENCY_INPUT"; exit 1; }
          for pair in $ALLOW_INPUT; do
            [[ "$pair" =~ ^[a-z0-9-]+:[a-z-]+$ ]] || { echo "Bad allow value: $pair (expected <slug>:<flag>)"; exit 1; }
          done
          if [ -z "$RO_KEY" ] || [ -z "$RO_SECRET" ]; then
            echo "Missing the read-only R2 keys. Add repository secrets R2_RO_ACCESS_KEY_ID and R2_RO_SECRET_ACCESS_KEY:"
            echo "an R2 API token with Object Read only, scoped to the data and archive buckets."
            echo "The dry run never uses the write keys, because it runs the code of any branch."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The processing date math uses the machine's local time (pipeline/transit-calendar.ts,
      # process-core.ts), so output depends on the timezone. Everything was reviewed on Toronto time.
      - name: Check the timezone
        run: |
          date
          echo "TZ=$TZ"
          zone="$(node -p "Intl.DateTimeFormat().resolvedOptions().timeZone")"
          echo "node timezone: $zone"
          [ "$zone" = "America/Toronto" ] || { echo "Expected America/Toronto"; exit 1; }

      - name: Type check
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.api.json

      - name: Install tippecanoe
        run: sudo apt-get install -y tippecanoe

      # reprocess-derived-artifacts exits 1 when any agency is refused (expired or older-than-live
      # zip, or a release gate flag), which is a normal outcome. continue-on-error keeps the run
      # going; the summary step below decides whether anything really failed.
      - name: Reprocess every agency (dry run)
        id: reprocess
        continue-on-error: true
        run: |
          allow_args=()
          for pair in $ALLOW_INPUT; do allow_args+=(--allow "$pair"); done
          REPROCESS_CONCURRENCY="$CONCURRENCY_INPUT" npm run reprocess-derived-artifacts -- "${allow_args[@]}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          MUNI_511_API_KEY: ${{ secrets.MUNI_511_API_KEY }}
          CATA_LANSING_API_KEY: ${{ secrets.CATA_LANSING_API_KEY }}
          GRAND_EST_API_KEY: ${{ secrets.GRAND_EST_API_KEY }}

      # Refused agencies are normal; only a crash (no report) or a "failed" agency is an error.
      - name: Summarize the reprocess
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os
          out = os.environ['GITHUB_OUTPUT']
          md = os.environ['GITHUB_STEP_SUMMARY']
          path = 'tmp/derived-reprocess/report.json'
          lines = ['## Rebuild dry run', '']
          fatal = ''
          if not os.path.exists(path):
              lines.append('No report was written: the reprocess crashed before it finished. See the log.')
              fatal = 'the reprocess crashed before writing a report'
              open(out, 'a').write('report=false\n')
          else:
              open(out, 'a').write('report=true\n')
              rep = json.load(open(path))
              t = rep.get('totals', {})
              rows = rep.get('agencies', [])
              lines.append(f"**{t.get('processed', 0)} processed**, {t.get('refused', 0)} refused, {t.get('failed', 0)} failed, {t.get('skipped', 0)} skipped (of {t.get('targets', len(rows))} agencies).")
              lines.append('')
              lines.append('A refused agency keeps its live data: its zip is expired or older than live, or a release gate flag blocked it. That is a normal outcome. A failed agency is a real error.')
              for status, title in (('failed', 'Failed (errors)'), ('refused', 'Refused (live data kept)')):
                  sel = [r for r in rows if r.get('status') == status]
                  if sel:
                      lines += ['', f'### {title}: {len(sel)}', '', '| Agency | Reason |', '|---|---|']
                      lines += [f"| {r['slug']} | {str(r.get('reason', '')).replace('|', '/')} |" for r in sel]
              if t.get('failed', 0) > 0:
                  fatal = f"{t['failed']} agencies failed"
              flags = []
              for f in sorted(glob.glob('tmp/release-diff/*.json')):
                  try:
                      flags += json.load(open(f)).get('flags', [])
                  except Exception:
                      pass
              red = [x for x in flags if x.get('level') == 'red']
              yellow = [x for x in flags if x.get('level') == 'yellow']
              lines += ['', f'### Release gate: {len(red)} red, {len(yellow)} yellow flags', '']
              if red:
                  lines += ['| Agency | Flag | Detail | Allowed |', '|---|---|---|---|']
                  lines += [f"| {x['slug']} | {x['flag']} | {str(x.get('message', '')).replace('|', '/')} | {'yes' if x.get('allowed') else 'no'} |" for x in red]
              lines += ['', 'Yellow flags and the full diff are in the uploaded release-diff report.']
          open(md, 'a').write('\n'.join(lines) + '\n')
          open(out, 'a').write(f'fatal={fatal}\n')
          PY

      - name: Build PMTiles from the reprocessed data (dry run)
        if: always() && steps.summary.outputs.report == 'true'
        run: npm run build-pmtiles -- --dry-run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          ATLAS_LOCAL_PREVIEW_DIR: tmp/derived-reprocess

      - name: Upload the reprocess report and release diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-report-dry-run-${{ github.run_id }}
          path: |
            tmp/derived-reprocess/report.json
            tmp/release-diff/*.md
            tmp/release-diff/*.json
          if-no-files-found: warn
          retention-days: 30

      # Last, so the tile build and the report upload always happen first.
      - name: Fail on real errors
        if: always() && steps.summary.outputs.fatal != ''
        env:
          FATAL: ${{ steps.summary.outputs.fatal }}
        run: |
          echo "Real error: $FATAL"
          exit 1

  # ---------------------------------------------------------------------------------------
  # Publish. Only ever builds the tip of main, with the write-capable keys.
  # ---------------------------------------------------------------------------------------
  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    # GitHub's hard limit is 360 minutes. The last local full run was about 55 minutes of
    # reprocess plus the tile build; if a run ever approaches the limit, resume it with start_at.
    timeout-minutes: 345
    env:
      REF_INPUT: ${{ inputs.ref }}
      START_AT: ${{ inputs.start_at }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      ALLOW_INPUT: ${{ inputs.allow }}
      CONCURRENCY_INPUT: ${{ inputs.concurrency }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check the inputs
        run: |
          [[ "$CONCURRENCY_INPUT" =~ ^[1-4]$ ]] || { echo "concurrency must be 1-4, got: $CONCURRENCY_INPUT"; exit 1; }
          for pair in $ALLOW_INPUT; do
            [[ "$pair" =~ ^[a-z0-9-]+:[a-z-]+$ ]] || { echo "Bad allow value: $pair (expected <slug>:<flag>)"; exit 1; }
          done
          if [ -n "$RESUME_RUN_ID" ] && ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be a run id (digits), got: $RESUME_RUN_ID"; exit 1
          fi
          if { [ "$START_AT" = "history" ] || [ "$START_AT" = "publish" ]; } && [ -z "$RESUME_RUN_ID" ]; then
            echo "start_at=$START_AT needs resume_run_id: the release manifest from the earlier run."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      # Publishing rebuilds the live map, so it only ever builds the code that is on main.
      - name: Build main only
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Refusing to publish: ref '$REF_INPUT' is $(git rev-parse --short HEAD), main is $(git rev-parse --short FETCH_HEAD)."
            echo "Merge the work to main and run again with ref=main, or use mode=dry-run for a branch."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The processing date math uses the machine's local time (pipeline/transit-calendar.ts,
      # process-core.ts), so output depends on the timezone. Everything was reviewed on Toronto time.
      - name: Check the timezone
        run: |
          date
          echo "TZ=$TZ"
          zone="$(node -p "Intl.DateTimeFormat().resolvedOptions().timeZone")"
          echo "node timezone: $zone"
          [ "$zone" = "America/Toronto" ] || { echo "Expected America/Toronto"; exit 1; }

      - name: Type check
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.api.json

      - name: Test
        if: inputs.start_at == 'reprocess'
        run: npm run test

      - name: Install tippecanoe
        run: sudo apt-get install -y tippecanoe

      # ---- Resume: bring back what the earlier run left on its own runner ----------------

      - name: Download the earlier run's saved stamps
        if: inputs.start_at != 'reprocess' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: rebuild-stamps-${{ inputs.resume_run_id }}
          path: tmp/rebuild-state
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the earlier run's release manifest
        if: inputs.start_at == 'history' || inputs.start_at == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: rebuild-manifest-${{ inputs.resume_run_id }}
          path: tmp/rebuild-manifest
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The manifest and the stamps belong to one build of main: refuse if main has moved on.
      - name: Check the resumed run built this commit and put its files back
        if: inputs.start_at != 'reprocess' && inputs.resume_run_id != ''
        run: |
          head_sha="$(git rev-parse HEAD)"
          for dir in tmp/rebuild-state tmp/rebuild-manifest; do
            [ -f "$dir/sha.txt" ] || continue
            if [ "$(cat "$dir/sha.txt")" != "$head_sha" ]; then
              echo "main is now ${head_sha:0:7}; run $RESUME_RUN_ID built $(cut -c1-7 "$dir/sha.txt")."
              echo "Resuming across a new commit would mix builds. Start again with start_at=reprocess."
              exit 1
            fi
          done
          if [ -s tmp/rebuild-state/stamps.patch ]; then
            if git apply --check tmp/rebuild-state/stamps.patch 2>/dev/null; then
              git apply tmp/rebuild-state/stamps.patch
            elif git apply -R --check tmp/rebuild-state/stamps.patch 2>/dev/null; then
              echo "The stamps are already on main (their pull request was merged)."
            else
              echo "The saved stamps neither apply nor are already applied."; exit 1
            fi
          fi
          if [ -f tmp/rebuild-manifest/atlas-release-manifest.json ]; then
            cp tmp/rebuild-manifest/atlas-release-manifest.json tmp/atlas-release-manifest.json
          fi
          git diff --shortstat

      # ---- Reprocess ---------------------------------------------------------------------

      # continue-on-error: when some agency is refused the run exits 1 after uploading the
      # others. Their stamped expiry files must still be kept, so the steps below run and the
      # failure is re-raised afterwards.
      - name: Reprocess every agency and write the artifacts to R2
        id: reprocess
        if: inputs.start_at == 'reprocess'
        continue-on-error: true
        run: |
          allow_args=()
          for pair in $ALLOW_INPUT; do allow_args+=(--allow "$pair"); done
          REPROCESS_CONCURRENCY="$CONCURRENCY_INPUT" npm run reprocess-derived-artifacts -- --write "${allow_args[@]}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MUNI_511_API_KEY: ${{ secrets.MUNI_511_API_KEY }}
          CATA_LANSING_API_KEY: ${{ secrets.CATA_LANSING_API_KEY }}
          GRAND_EST_API_KEY: ${{ secrets.GRAND_EST_API_KEY }}

      # reprocess-derived-artifacts exits 1 when any agency is refused (expired or older-than-live
      # zip, or a release gate flag such as GRT mode-lost). Those agencies keep their live data and
      # are a normal outcome, as in the dry run. Only a crash (no report) or a "failed" agency is
      # a real error that stops the run.
      - name: Check the reprocess outcome
        id: reprocess-check
        if: always() && inputs.start_at == 'reprocess' && steps.reprocess.outcome != 'skipped'
        env:
          REPROCESS_OUTCOME: ${{ steps.reprocess.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          out = os.environ['GITHUB_OUTPUT']
          md = os.environ['GITHUB_STEP_SUMMARY']
          path = 'tmp/derived-reprocess/report.json'
          lines = ['## Rebuild publish: reprocess', '']
          fatal = ''
          try:
              if not os.path.exists(path):
                  lines.append('No report was written: the reprocess crashed before it finished. See the log.')
                  fatal = 'the reprocess crashed before writing a report'
              else:
                  rep = json.load(open(path))
                  t = rep.get('totals', {})
                  rows = rep.get('agencies', [])
                  refused, failed = t.get('refused', 0), t.get('failed', 0)
                  lines.append(f"**{t.get('processed', 0)} written**, {refused} refused (live data kept), {failed} failed, {t.get('skipped', 0)} skipped (of {t.get('targets', len(rows))} agencies).")
                  for status, title in (('failed', 'Failed (errors)'), ('refused', 'Refused (live data kept)')):
                      sel = [r for r in rows if r.get('status') == status]
                      if sel:
                          lines += ['', f'### {title}: {len(sel)}', '', '| Agency | Reason |', '|---|---|']
                          lines += [f"| {r['slug']} | {str(r.get('reason', '')).replace('|', '/')} |" for r in sel]
                  if failed > 0:
                      fatal = f'{failed} agencies failed'
                  elif os.environ.get('REPROCESS_OUTCOME') == 'failure' and refused == 0:
                      # It exited 1 with nothing refused or failed: something after the report went wrong
                      # (for example bumping the public data version), so it is not a normal refusal.
                      fatal = 'the reprocess exited with an error although no agency was refused or failed'
          except Exception as e:
              # A malformed report must not skip the steps that save the stamps; stop the run after them.
              lines.append(f'Could not read the report: {e}')
              fatal = f'could not read the reprocess report ({type(e).__name__})'
          open(md, 'a').write('\n'.join(lines) + '\n')
          open(out, 'a').write(f'fatal={fatal}\n')
          PY

      # --write stamps each rebuilt agency's feed expiry in public/data/index.json and
      # config/agencies/<slug>.json. Save them as a patch (a resumed run reapplies it) before the
      # pull request step moves them.
      - name: Save the stamped files
        id: stamps
        if: always() && inputs.start_at == 'reprocess' && steps.reprocess.outcome != 'skipped'
        run: |
          mkdir -p tmp/rebuild-state
          git rev-parse HEAD > tmp/rebuild-state/sha.txt
          git add -A
          git diff --cached --binary > tmp/rebuild-state/stamps.patch
          git reset --quiet
          git diff --shortstat

      - name: Upload the saved stamps
        if: always() && steps.stamps.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-stamps-${{ github.run_id }}
          path: tmp/rebuild-state
          retention-days: 14

      # main is protected, so the stamps go in as a small pull request.
      - name: Open or update the reprocess metadata pull request
        id: reprocess-pr
        if: always() && steps.stamps.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: reprocess feed expiry stamps"
          title: "chore: reprocess feed expiry stamps"
          body: |
            Automated: feed expiry metadata stamped by a full reprocess (rebuild-release workflow).
          branch: automation/reprocess-metadata
          delete-branch: true
          labels: data-quality,pipeline

      # Re-raise a real reprocess error now that its stamps are saved: nothing after this runs.
      # A run where every agency was written or refused is clean and goes on to the tiles.
      - name: Stop when the reprocess had a real error
        if: always() && steps.reprocess-check.outputs.fatal != ''
        env:
          FATAL: ${{ steps.reprocess-check.outputs.fatal }}
        run: |
          echo "Real error: $FATAL"
          echo "Agencies it already wrote stay in R2, and their stamps are in the pull request. No release was built."
          exit 1

      # create-pull-request resets this checkout to origin/main; put the stamped files back so the
      # tiles and the release are built from what the reprocess wrote.
      - name: Restore the stamped files after the pull request step
        if: inputs.start_at == 'reprocess'
        env:
          REPROCESS_HEAD_SHA: ${{ steps.reprocess-pr.outputs.pull-request-head-sha }}
        run: |
          if [ -n "$REPROCESS_HEAD_SHA" ]; then
            git checkout "$REPROCESS_HEAD_SHA" -- .
            git reset --quiet
          fi
          git diff --shortstat

      # ---- Tiles, history, release -------------------------------------------------------

      # A reprocess leaves no refresh handoff marker, so this intentional repack needs
      # --allow-stale-data (docs/operations/DATA_REPROCESSING.md).
      - name: Build and upload the PMTiles release (not public yet)
        if: inputs.start_at == 'reprocess' || inputs.start_at == 'pmtiles'
        run: npm run build-pmtiles -- --allow-stale-data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The manifest ties the uploaded release to verify and publish. It only exists on this
      # runner, so keep it (with the commit it was built from) for a resume.
      - name: Save the release manifest
        id: manifest
        if: always() && (inputs.start_at == 'reprocess' || inputs.start_at == 'pmtiles') && hashFiles('tmp/atlas-release-manifest.json') != ''
        run: |
          mkdir -p tmp/rebuild-manifest
          cp tmp/atlas-release-manifest.json tmp/rebuild-manifest/
          git rev-parse HEAD > tmp/rebuild-manifest/sha.txt

      - name: Upload the release manifest
        if: always() && steps.manifest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-manifest-${{ github.run_id }}
          path: tmp/rebuild-manifest
          retention-days: 14

      - name: Verify the uploaded release
        if: inputs.start_at == 'reprocess' || inputs.start_at == 'pmtiles'
        run: npm run verify-pmtiles-remote
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Writes atlas/history-config.json to the LIVE bucket straight away; it is not gated by the
      # publish step below.
      - name: Rebuild history config
        if: inputs.start_at != 'publish'
        run: npm run build-history
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ARCHIVE_BUCKET_NAME: ${{ secrets.R2_ARCHIVE_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Repeat every --allow accepted during the reprocess: publish compares the whole release
      # with the public one again.
      - name: Publish the verified data release
        run: |
          allow_args=()
          for pair in $ALLOW_INPUT; do allow_args+=(--allow "$pair"); done
          npm run publish-data-release -- "${allow_args[@]}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # publish-data-release regenerates shared/data/agency-pages*.json from the new release.
      # Agency pages are prerendered from those committed files, so they go in as a small PR
      # exactly as the weekly refresh does (CI is dispatched on the branch, then auto-merge).
      - name: Read the published release id
        id: agency-pages-release
        run: echo "id=$(node -p "require('./shared/data/agency-pages.json').releaseId")" >> "$GITHUB_OUTPUT"

      - name: Open agency pages pull request
        id: agency-pages-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            shared/data/agency-pages.json
            shared/data/agency-page-slugs.json
          commit-message: "Regenerate agency pages for release-${{ steps.agency-pages-release.outputs.id }}"
          title: "Regenerate agency pages for release-${{ steps.agency-pages-release.outputs.id }}"
          body: |
            Automated: agency page data regenerated from the data release that was just published, so agency pages match the live map.
          branch: automation/agency-pages
          delete-branch: true
          labels: data-quality,pipeline

      - name: Run CI on the agency pages branch
        if: steps.agency-pages-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/agency-pages

      - name: Auto-merge agency pages pull request once checks pass
        if: steps.agency-pages-pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.agency-pages-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash

      - name: Upload the reprocess report and release diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-report-publish-${{ github.run_id }}
          path: |
            tmp/derived-reprocess/report.json
            tmp/release-diff/*.md
            tmp/release-diff/*.json
          if-no-files-found: warn
          retention-days: 30
